<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dear Diary</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            font-family: Arial, sans-serif;
            background: url('a.jpeg') no-repeat center center fixed;
            background-size: cover;
            height: 85vh;
            display: flex;
            flex-direction: column;
        }
        h1 {
            font-size: 5vw;
            margin: 0 0 10px 0;
            text-align: center;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }
        #messages {
            list-style-type: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
            overflow-y: auto;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
        }
        #messages li {
            padding: 8px;
            border-bottom: 1px solid #eee;
            word-wrap: break-word;
            font-size: 4vw;
        }
        .timestamp {
            color: #666;
            font-size: 3vw;
            margin-left: 10px;
        }
        .input-area {
            display: flex;
            padding-top: 10px;
            gap: 10px;
        }
        #messageInput {
            flex-grow: 1;
            padding: 10px;
            font-size: 4vw;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        button {
            padding: 10px 20px;
            font-size: 4vw;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            touch-action: manipulation; /* 优化触摸事件 */
        }
        button:active {
            background-color: #0056b3;
        }
        #error {
            color: red;
            font-size: 3vw;
            text-align: center;
        }
        #keyModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        #keyBox {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            width: 80%;
            max-width: 400px;
        }
        #privateKeyInput {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-size: 3vw;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<h1>Dear Diary v0.3</h1>
<ul id="messages"></ul>
<div class="input-area">
    <input id="messageInput" type="text" placeholder="log Diary">
    <button id="actionButton">log</button>
</div>
<div id="error"></div>
<div id="keyModal">
    <div id="keyBox">
        <h3>setting</h3> <!-- 模糊标题，隐藏解密意图 -->
        <textarea id="privateKeyInput" placeholder="Bazinga"></textarea>
        <br>
        <button onclick="verifyAndDecrypt()">Bazinga</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.0.0-rc.1/jsencrypt.min.js"></script>
<script>
    const socket = io();
    const encryptor = new JSEncrypt();
    const decryptor = new JSEncrypt();
    let messagesData = [];
    let isDecrypted = false;

    const messages = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const errorDiv = document.getElementById('error');
    const keyModal = document.getElementById('keyModal');
    const privateKeyInput = document.getElementById('privateKeyInput');
    const actionButton = document.getElementById('actionButton');
    const max_display = 50;
    let messageCount = 0;

    // Dummy 内容生成
    function generateDummyContent(length) {
        const dummyWords = ['天气不错', '今天很忙', '随便写写', '没什么特别的', '加油加油'];
        let result = '';
        for (let i = 0; i < length; i++) {
            result += dummyWords[Math.floor(Math.random() * dummyWords.length)] + ' ';
        }
        return result.trim();
    }

    socket.on('publicKey', (publicKey) => {
        encryptor.setPublicKey(publicKey);
        //console.log('收到公钥');
    });

    const username = localStorage.getItem('username');
    if (username) {
        socket.emit('relogin', username);
    }

    function displayMessages() {
        messages.innerHTML = '';
        messageCount = 0;
        messagesData.forEach((msg) => {
            if (messageCount < max_display) {
                const li = document.createElement('li');
                const content = isDecrypted && msg.decrypted ?
                    `${msg.username}: ${msg.decrypted}` :
                    `${msg.username}: ${generateDummyContent(3)}`;
                li.innerHTML = `${content} <span class="timestamp">[${msg.timestamp}]</span>`;
                messages.appendChild(li);
                messageCount++;
            }
        });
        messages.scrollTop = messages.scrollHeight;
    }

    socket.on('history', (history) => {
        messagesData = history.map(msg => ({
            username: msg.username,
            content: msg.content,
            decrypted: null,
            timestamp: msg.timestamp
        }));
        displayMessages();
    });

    socket.on('chatMessage', (msg) => {
        const message = {
            username: msg.username,
            content: msg.content,
            decrypted: null,
            timestamp: msg.timestamp
        };
        if (messageCount >= max_display) {
            messagesData.shift();
            messages.removeChild(messages.firstChild);
        } else {
            messageCount++;
        }
        messagesData.push(message);
        const li = document.createElement('li');
        const content = isDecrypted && message.decrypted ?
            `${msg.username}: ${message.decrypted}` :
            `${msg.username}: ${generateDummyContent(3)}`;
        li.innerHTML = `${content} <span class="timestamp">[${msg.timestamp}]</span>`;
        messages.appendChild(li);
        messages.scrollTop = messages.scrollHeight;
    });

    function sendMessage() {
        const msg = messageInput.value.trim();
        if (msg) {
            const encryptedMsg = encryptor.encrypt(msg);
            if (encryptedMsg === false) {
                errorDiv.textContent = '消息太长，无法加密（限 80 字）';
                return;
            }
            socket.emit('chatMessage', encryptedMsg);
            messageInput.value = '';
        }
    }

    function showKeyModal() {
        keyModal.style.display = 'flex';
    }

    function verifyAndDecrypt() {
        const privateKey = privateKeyInput.value.trim();
        if (!privateKey) {
            errorDiv.textContent = '请输入内容';
            return;
        }
        decryptor.setPrivateKey(privateKey);
        let allValid = true;
        messagesData.forEach((msg) => {
            try {
                msg.decrypted = decryptor.decrypt(msg.content);
                if (msg.decrypted === null) allValid = false;
            } catch (e) {
                allValid = false;
            }
        });
        if (allValid) {
            isDecrypted = true;
            displayMessages();
            keyModal.style.display = 'none';
            errorDiv.textContent = '';
        } else {
            errorDiv.textContent = '内容无效';
            privateKeyInput.value = '';
        }
    }

    // 按钮事件：点击发送，长按解密
    let pressTimer;
    actionButton.addEventListener('mousedown', () => {
        pressTimer = setTimeout(showKeyModal, 2000); // 长按 1 秒触发
    });
    actionButton.addEventListener('mouseup', () => {
        clearTimeout(pressTimer);
        sendMessage(); // 松开时发送
    });
    actionButton.addEventListener('touchstart', (e) => {
        e.preventDefault(); // 防止默认触摸行为
        pressTimer = setTimeout(showKeyModal, 2000);
    });
    actionButton.addEventListener('touchend', (e) => {
        e.preventDefault();
        clearTimeout(pressTimer);
        sendMessage();
    });

    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
