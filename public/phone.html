<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 适配手机视口 -->
    <title>Dear Diary</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            font-family: Arial, sans-serif;
            background: url('bg3.JPG') no-repeat center center fixed;
            background-size: cover;
            height: 85vh; /* 占满屏幕高度 */
            display: flex;
            flex-direction: column;
        }
        h1 {
            font-size: 5vw; /* 根据屏幕宽度调整标题大小 */
            margin: 0 0 10px 0;
            text-align: center;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }
        #messages {
            list-style-type: none;
            padding: 0;
            margin: 0;
            flex-grow: 1; /* 消息区域占满剩余空间 */
            overflow-y: auto; /* 滚动显示消息 */
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
        }
        #messages li {
            padding: 8px;
            border-bottom: 1px solid #eee;
            word-wrap: break-word; /* 长消息自动换行 */
            font-size: 4vw; /* 消息文字适配屏幕 */
        }
        .timestamp {
            color: #666;
            font-size: 3vw;
            margin-left: 10px;
        }
        .input-area {
            display: flex;
            padding-top: 10px;
            gap: 10px; /* 输入框和按钮间距 */
        }
        #messageInput {
            flex-grow: 1; /* 输入框占满可用空间 */
            padding: 10px;
            font-size: 4vw; /* 文字大小适配 */
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        button {
            padding: 10px 20px;
            font-size: 4vw; /* 按钮文字适配 */
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:active {
            background-color: #0056b3; /* 点击时变色 */
        }
    </style>
</head>
<body>
<h1>Dear Diary v0.21</h1>
<ul id="messages"></ul>
<div class="input-area">
    <input id="messageInput" type="text" placeholder="input message">
    <button onclick="sendMessage()">Send</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    console.log('连接到服务器');

    const messages = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const max_display = 50;
    let messageCount = 0;
    //接收历史消息
    // 从本地存储获取用户名（临时方案）
    const username = localStorage.getItem('username');
    if (username) {
        socket.emit('relogin', username);
    }

    socket.on('history', (history) => {
        history.forEach((msg) => {
            if (messageCount < max_display) {
                const li = document.createElement('li');
                li.innerHTML = `${msg.content} <span class="timestamp">[${msg.timestamp}]</span>`;
                //li.textContent = msg;
                messages.appendChild(li);
                messageCount++;}
        });
        messages.scrollTop = messages.scrollHeight;
    })
    // 接收消息
    socket.on('chatMessage', (msg) => {
        if (messageCount >= max_display) {
            messages.removeChild(messages.firstChild);
        } else {
            messageCount++;
        }
        const li = document.createElement('li');
        li.innerHTML = `${msg.content} <span class="timestamp">[${msg.timestamp}]</span>`;
        //li.textContent = msg;
        messages.appendChild(li);
        messages.scrollTop = messages.scrollHeight; // 自动滚动到底部
    });

    // 发送消息
    function sendMessage() {
        const msg = messageInput.value.trim();
        if (msg) {
            socket.emit('chatMessage', msg);
            messageInput.value = '';
        }
    }

    // 回车键发送（手机上也能触发）
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
